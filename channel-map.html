<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Channel map</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style id="css">
:root{--bg:#E9E9EC;--plate:#F8F8F9;--ink:#18181B;--muted:#5B5B63;--line:#C8C8CE;--oxide:#9A4A22;--hivis:#FF6A00;--rivet:#B4B4BB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#141416;--plate:#1F1F23;--ink:#EDEDEF;--muted:#A1A1AA;--line:#38383F;--oxide:#D9844F;--hivis:#FF7A1A;--rivet:#4A4A52}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 120px}

.lede{color:var(--muted);margin:0 0 4px;max-width:60ch}
.stamp{color:var(--muted);font-size:13px;margin:0 0 24px}
.plates{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}

.plate{position:relative;background:var(--plate);border:1px solid var(--line);border-radius:6px;padding:16px 16px 14px}
.plate::before,.plate::after{content:"";position:absolute;top:7px;width:6px;height:6px;border-radius:50%;background:var(--rivet)}
.plate::before{left:7px}.plate::after{right:7px}
.plate h2{font:800 18px/1.1 Archivo,Arial,sans-serif;margin:4px 0 2px}
.plate .dom{color:var(--muted);font-size:12px;margin:0 0 12px;overflow-wrap:anywhere}
.pct{font:800 30px/1 Archivo,Arial,sans-serif}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hivis)}
.next{font-size:13px;color:var(--muted);margin:0}
.next b{color:var(--ink);font-weight:600}
.scroller{overflow-x:auto;background:var(--plate);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:0}
thead th{font:600 13px/1.2 Archivo,Arial,sans-serif;padding:12px 6px;text-align:center;border-bottom:2px solid var(--ink);position:sticky;top:0;background:var(--plate)}
thead th:first-child{text-align:left;padding-left:14px}
.grp td.gp{font:600 12px/1 "IBM Plex Sans",system-ui,sans-serif;color:var(--muted);text-align:center;padding:18px 4px 6px}
.grp th{font:700 13px/1 Archivo,Arial,sans-serif;color:var(--oxide);padding:18px 14px 6px;text-align:left}
tbody td.lbl,tbody th.lbl{padding:8px 8px 8px 14px;font-weight:500;font-size:14px;position:sticky;left:0;background:var(--plate);min-width:170px;border-top:1px solid var(--line)}
tbody td.c{border-top:1px solid var(--line);text-align:center}
.cellbtn{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;cursor:pointer;position:relative}

.cellbtn:hover .mk{transform:scale(1.12)}

.mk[data-s="none"]{border-color:var(--line)}
.mk[data-s="progress"]{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.mk[data-s="done"]{background:var(--ink)}
.mk[data-s="live"]{background:var(--hivis);border-color:var(--hivis);box-shadow:0 0 0 3px var(--plate),0 0 0 4px var(--hivis)}
.mk[data-s="check"]{border-style:dashed;border-color:var(--oxide)}

.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:16px 2px 0;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend .mk{width:14px;height:14px}
.hint{font-size:13px;color:var(--muted);margin:10px 2px 0}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.savebar[hidden]{display:none}
.savebar p{margin:0;font-size:14px}
button.b{font:600 14px "IBM Plex Sans",system-ui,sans-serif;border-radius:4px;padding:10px 16px;cursor:pointer;border:1px solid currentColor;background:transparent;color:inherit}
button.b.pri{background:var(--hivis);border-color:var(--hivis);color:#1A0E00}
button.b:focus-visible{outline:2px solid var(--hivis);outline-offset:2px}

dialog{border:1px solid var(--line);border-radius:8px;background:var(--plate);color:var(--ink);padding:0;width:min(440px,calc(100% - 24px));max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{padding:20px}
.sheet .proj{font-size:13px;color:var(--oxide);font-weight:600;margin:0}
.sheet h3{font:800 22px/1.15 Archivo,Arial,sans-serif;margin:4px 0 6px}
.sheet .h{color:var(--muted);font-size:14px;margin:0 0 16px}
.opts{display:grid;gap:6px;margin-bottom:16px}
.opt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:15px}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt:focus-visible{outline:2px solid var(--hivis)}
label.nl{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input.note{width:100%;font:15px "IBM Plex Sans",system-ui,sans-serif;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.sheet .row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
.sheet .upd{font-size:12px;color:var(--muted)}
.ro{font-size:13px;color:var(--oxide);margin:0 0 16px}
@media (prefers-reduced-motion:reduce){.mk{transition:none}}
